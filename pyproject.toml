[project]
name = "reacao"
version = "0.1.0"
description = "Painel de Reação do Culto — pipeline de vídeo em lote, agregado e anônimo (PoC)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
gpu = [
  "onnxruntime-gpu>=1.17",
  "insightface>=0.7.3",
  "hsemotion-onnx>=0.3",
  "faster-whisper>=1.0",
  "sixdrepnet>=0.1.6",
]
pyfeat = ["py-feat>=0.6.1"]
libreface = ["libreface>=0.1"]
llm = ["anthropic>=0.30"]
dev = ["pytest>=8", "ruff>=0.4", "pandas>=2.0"]   # pandas: bench.py e tests/test_bench_metricas.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reacao*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
